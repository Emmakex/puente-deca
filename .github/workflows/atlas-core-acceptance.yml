name: DeCA Atlas Core Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm DeCA-only Atlas/GridFS production acceptance
        required: true
        default: false
        type: boolean

concurrency:
  group: puente-deca-atlas-core-acceptance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  atlas-core:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: deca-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Assert protected main execution and operations secret
        shell: bash
        env:
          OPERATIONS_HEALTH_SECRET: ${{ secrets.OPERATIONS_HEALTH_SECRET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          if [ ${#OPERATIONS_HEALTH_SECRET} -lt 32 ]; then
            echo "::error::OPERATIONS_HEALTH_SECRET is not configured in the deca-production environment"
            exit 1
          fi

      - name: Run DeCA-only Atlas core acceptance inside Hostinger
        shell: bash
        env:
          OPERATIONS_HEALTH_SECRET: ${{ secrets.OPERATIONS_HEALTH_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/deca-atlas-core

          http_status="$(
            curl \
              --silent \
              --show-error \
              --max-time 120 \
              --request POST \
              --header "authorization: Bearer ${OPERATIONS_HEALTH_SECRET}" \
              --header "x-kairoseth-acceptance-confirm: deca-atlas-core-production" \
              --output .artifacts/deca-atlas-core/hostinger-response.json \
              --write-out '%{http_code}' \
              https://kairoseth.com/api/operations/deca/atlas-core-acceptance
          )"

          if [ "$http_status" != "200" ]; then
            HTTP_STATUS="$http_status" node -e '
              const fs = require("node:fs");
              let response = {};
              try {
                response = JSON.parse(fs.readFileSync(".artifacts/deca-atlas-core/hostinger-response.json", "utf8"));
              } catch {}
              const allowedContractFailures = new Set([
                "shape.topLevel",
                "status",
                "check",
                "scope",
                "database",
                "artifactBucket",
                "shape.steps",
                "steps.preflight",
                "steps.atlasGridFs",
                "steps.atlasConcurrency",
                "steps.artifactReconciliation",
                "shape.evidence",
                "evidence.metadataPing",
                "evidence.artifactPing",
                "evidence.indexContract",
                "evidence.transactionRollback",
                "evidence.gridfsRoundTrip",
                "evidence.gridfsCleanup",
                "evidence.idempotencyConcurrency",
                "evidence.idempotencyConverged",
                "evidence.documentVersionConcurrency",
                "evidence.documentLineageConsistent",
                "evidence.cleanupVerified",
                "shape.reconciliation",
                "reconciliation.missingBeforeRetention",
                "reconciliation.missingAfterRetention",
                "reconciliation.orphanedArtifacts",
                "reconciliation.purgedArtifactsStillPresent"
              ]);
              const contractFailures = Array.isArray(response?.contractFailures)
                ? response.contractFailures.filter((value) => allowedContractFailures.has(value)).slice(0, 32)
                : [];
              const safe = {
                status: "error",
                check: "deca-atlas-core-acceptance",
                code: "HOSTINGER_ATLAS_ACCEPTANCE_FAILED",
                httpStatus: Number(process.env.HTTP_STATUS || 0),
                reason: typeof response?.reason === "string" ? response.reason : undefined,
                engineCode: typeof response?.engineCode === "string" ? response.engineCode : undefined,
                engineStep: typeof response?.engineStep === "string" ? response.engineStep : undefined,
                causeCode: typeof response?.causeCode === "string" ? response.causeCode : undefined,
                causeClass: typeof response?.causeClass === "string" ? response.causeClass : undefined,
                contractFailures: contractFailures.length > 0 ? contractFailures : undefined
              };
              console.error(JSON.stringify(safe));
              process.exit(1);
            '
          fi

          node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(".artifacts/deca-atlas-core/hostinger-response.json", "utf8"));
            const result = response?.result;
            const steps = result?.steps;
            const checks = result?.evidence;
            const reconciliation = result?.reconciliation;
            if (
              response?.status !== "ok" ||
              response?.check !== "kairoseth-cargo-atlas-core-acceptance" ||
              response?.scope !== "deca-only" ||
              response?.runtime !== "hostinger-in-process" ||
              result?.status !== "ok" ||
              result?.check !== "deca-atlas-core-acceptance" ||
              result?.scope !== "deca-only" ||
              result?.database !== "kairoseth" ||
              result?.artifactBucket !== "deca_pdf" ||
              !steps || Object.values(steps).some((value) => value !== true) ||
              !checks || Object.values(checks).some((value) => value !== true) ||
              Number(reconciliation?.missingBeforeRetention) !== 0 ||
              Number(reconciliation?.missingAfterRetention) !== 0 ||
              Number(reconciliation?.orphanedArtifacts) !== 0 ||
              Number(reconciliation?.purgedArtifactsStillPresent) !== 0
            ) {
              throw new Error("Hostinger Atlas core acceptance result is not canonical and green");
            }
            const evidence = {
              schemaVersion: 1,
              check: "deca-atlas-core-acceptance",
              scope: "deca-only",
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              recordedAt: new Date().toISOString(),
              result
            };
            fs.writeFileSync(
              ".artifacts/deca-atlas-core/acceptance-evidence.json",
              `${JSON.stringify(evidence, null, 2)}\n`,
              { mode: 0o600 }
            );
          '
          sha256sum .artifacts/deca-atlas-core/acceptance-evidence.json \
            > .artifacts/deca-atlas-core/acceptance-evidence.json.sha256

      - name: Upload sanitized Atlas core acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: puente-deca-atlas-core-${{ github.run_id }}
          path: |
            .artifacts/deca-atlas-core/acceptance-evidence.json
            .artifacts/deca-atlas-core/acceptance-evidence.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove transient Hostinger response
        if: ${{ always() }}
        shell: bash
        run: rm -f .artifacts/deca-atlas-core/hostinger-response.json
