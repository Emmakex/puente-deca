name: DeCA Kairoseth Cargo CSP Edge Acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kairoseth-cargo-csp-edge-diagnostic.yml
      - scripts/production/kairoseth-cargo-current-deploy-edge-acceptance.sh
  workflow_dispatch:

concurrency:
  group: puente-deca-kairoseth-cargo-csp-edge-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: deca-production

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert protected main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Accept current deployed Kairoseth edge
        shell: bash
        env:
          OPERATIONS_HEALTH_SECRET: ${{ secrets.OPERATIONS_HEALTH_SECRET }}
          PUBLIC_PRODUCTION_URL: https://kairoseth.com
          KAIROSETH_CARGO_EDGE_EVIDENCE_DIR: .artifacts/kairoseth-cargo-edge
        run: bash scripts/production/kairoseth-cargo-current-deploy-edge-acceptance.sh

      - name: Upload sanitized edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairoseth-cargo-current-deploy-edge-evidence
          path: .artifacts/kairoseth-cargo-edge/current-deploy-edge-evidence.json
          if-no-files-found: ignore
          retention-days: 30
