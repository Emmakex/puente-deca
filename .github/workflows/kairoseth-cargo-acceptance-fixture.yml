name: DeCA Kairoseth Cargo Acceptance Fixture

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm synthetic production acceptance fixture refresh
        required: true
        default: false
        type: boolean

concurrency:
  group: puente-deca-kairoseth-cargo-acceptance-fixture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fixture:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deca-production

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert protected main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Refresh isolated fixture through deployed Kairoseth bridge
        shell: bash
        env:
          OPERATIONS_HEALTH_SECRET: ${{ secrets.OPERATIONS_HEALTH_SECRET }}
        run: |
          set -euo pipefail
          test ${#OPERATIONS_HEALTH_SECRET} -ge 32
          mkdir -p .artifacts/deca-fixture

          endpoint="https://kairoseth.com/api/operations/deca/acceptance-fixture"
          raw=".artifacts/deca-fixture/raw-result.json"
          status=""
          curl_status=0
          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

          for attempt in 1 2 3 4; do
            set +e
            status="$(curl -4 --silent --show-error --request POST \
              --connect-timeout 8 --max-time 25 \
              --header "Authorization: Bearer $OPERATIONS_HEALTH_SECRET" \
              --header "x-kairoseth-acceptance-confirm: synthetic-production-fixture" \
              --header "Accept: application/json" \
              --header "User-Agent: $user_agent" \
              --output "$raw" --write-out '%{http_code}' \
              "$endpoint")"
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ] && [ "$status" = "200" ]; then
              break
            fi
            [ "$attempt" -eq 4 ] || sleep 2
          done

          test "$curl_status" -eq 0
          test "$status" = "200"

          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('.artifacts/deca-fixture/raw-result.json', 'utf8'));
          if (
            result?.status !== 'ok' ||
            result?.check !== 'kairoseth-cargo-acceptance-fixture' ||
            result?.synthetic !== true ||
            result?.customerData !== false
          ) {
            throw new Error('Kairoseth fixture response is not green and synthetic');
          }
          if (typeof result?.shipmentId !== 'string' || result.shipmentId.length < 8) {
            throw new Error('Synthetic shipment ID is invalid');
          }
          if (!/^https:\/\/kairoseth\.com\/deca\/d\/[A-Za-z0-9_-]{16,128}\.pdf$/.test(result?.publicPdfUrl ?? '')) {
            throw new Error('Synthetic public PDF URL is not canonical');
          }
          fs.writeFileSync(
            '.artifacts/deca-fixture/public-pdf-url.txt',
            `${result.publicPdfUrl}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Verify public PDF and freeze fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          public_pdf_url="$(tr -d '\r\n' < .artifacts/deca-fixture/public-pdf-url.txt)"
          pdf_file="$RUNNER_TEMP/kairoseth-cargo-acceptance.pdf"
          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          status=""
          curl_status=0

          for attempt in 1 2 3 4; do
            set +e
            status="$(curl -4 --silent --show-error \
              --connect-timeout 8 --max-time 25 \
              --header "Accept: application/pdf" \
              --header "User-Agent: $user_agent" \
              --output "$pdf_file" --write-out '%{http_code}' \
              "$public_pdf_url")"
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ] && [ "$status" = "200" ]; then
              break
            fi
            [ "$attempt" -eq 4 ] || sleep 2
          done

          test "$curl_status" -eq 0
          test "$status" = "200"
          test "$(head -c 5 "$pdf_file")" = "%PDF-"
          pdf_size="$(stat -c '%s' "$pdf_file")"
          test "$pdf_size" -gt 0
          test "$pdf_size" -le 5000000
          export PDF_SHA256="sha256:$(sha256sum "$pdf_file" | awk '{print $1}')"

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const result = JSON.parse(fs.readFileSync('.artifacts/deca-fixture/raw-result.json', 'utf8'));
          const hash = (value) => `sha256:${crypto.createHash('sha256').update(value).digest('hex')}`;
          if (!/^sha256:[a-f0-9]{64}$/.test(process.env.PDF_SHA256 ?? '')) {
            throw new Error('Synthetic PDF SHA-256 is invalid');
          }

          const evidence = {
            schemaVersion: 1,
            check: 'kairoseth-cargo-acceptance-fixture',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            recordedAt: new Date().toISOString(),
            synthetic: true,
            customerData: false,
            source: 'deployed-kairoseth-runtime-bridge',
            shipmentIdSha256: hash(result.shipmentId),
            publicPdfUrlSha256: hash(result.publicPdfUrl),
            pdfSha256: process.env.PDF_SHA256
          };
          fs.writeFileSync(
            '.artifacts/deca-fixture/acceptance-evidence.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 }
          );

          const handoff = {
            schemaVersion: 1,
            shipmentId: result.shipmentId,
            publicPdfUrl: result.publicPdfUrl,
            pdfSha256: process.env.PDF_SHA256
          };
          fs.writeFileSync(
            '.artifacts/deca-fixture/operator-handoff.json',
            `${JSON.stringify(handoff, null, 2)}\n`,
            { mode: 0o600 }
          );
          NODE

          sha256sum .artifacts/deca-fixture/acceptance-evidence.json \
            > .artifacts/deca-fixture/acceptance-evidence.json.sha256
          chmod 600 .artifacts/deca-fixture/acceptance-evidence.json.sha256

      - name: Upload sanitized retained fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: kairoseth-cargo-fixture-evidence-${{ github.run_id }}
          path: |
            .artifacts/deca-fixture/acceptance-evidence.json
            .artifacts/deca-fixture/acceptance-evidence.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload short-lived operator handoff
        uses: actions/upload-artifact@v4
        with:
          name: kairoseth-cargo-fixture-handoff-${{ github.run_id }}
          path: .artifacts/deca-fixture/operator-handoff.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove transient fixture material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f .artifacts/deca-fixture/raw-result.json
          rm -f .artifacts/deca-fixture/public-pdf-url.txt
          rm -f .artifacts/deca-fixture/operator-handoff.json
          rm -f "$RUNNER_TEMP/kairoseth-cargo-acceptance.pdf"
