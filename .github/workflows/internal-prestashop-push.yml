name: DeCA Internal PrestaShop Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/internal-acceptance/prestashop.trigger'

concurrency:
  group: deca-internal-prestashop-acceptance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prestashop:
    name: PrestaShop ${{ matrix.prestashop }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: "1.7.8.11"
            image: "prestashop/prestashop-flashlight:1.7.8.11"
            database: "mysql:5.7"
            native_auth: "false"
          - prestashop: "8.2.7"
            image: "prestashop/prestashop-flashlight:8.2.7-nginx"
            database: "mysql:8.0"
            native_auth: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Build and extract exact release module ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            .artifacts/connectors \
            .artifacts/prestashop-module
          bash scripts/release/package-connectors.sh "$PWD/.artifacts/connectors"
          (cd .artifacts/connectors && sha256sum --check SHA256SUMS)
          unzip -q \
            .artifacts/connectors/puentedeca-prestashop-0.1.0.zip \
            -d .artifacts/prestashop-module
          test -f .artifacts/prestashop-module/puentedeca/puentedeca.php
          cat > .artifacts/presta-client.cnf <<'EOF'
          [client]
          skip-ssl
          EOF
          chmod 600 .artifacts/presta-client.cnf

      - name: Start isolated PrestaShop database and real store
        shell: bash
        run: |
          set -euo pipefail
          docker network create pdeca-presta
          if [ '${{ matrix.native_auth }}' = 'true' ]; then
            docker run --detach \
              --name pdeca-presta-db \
              --network pdeca-presta \
              --env MYSQL_DATABASE=prestashop \
              --env MYSQL_USER=prestashop \
              --env MYSQL_PASSWORD=prestashop \
              --env MYSQL_ROOT_PASSWORD=internal-root-only \
              '${{ matrix.database }}' \
              --default-authentication-plugin=mysql_native_password
          else
            docker run --detach \
              --name pdeca-presta-db \
              --network pdeca-presta \
              --env MYSQL_DATABASE=prestashop \
              --env MYSQL_USER=prestashop \
              --env MYSQL_PASSWORD=prestashop \
              --env MYSQL_ROOT_PASSWORD=internal-root-only \
              '${{ matrix.database }}'
          fi
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec pdeca-presta-db mysqladmin ping -uroot -pinternal-root-only --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          docker run --detach \
            --name pdeca-presta \
            --network pdeca-presta \
            --user 0:0 \
            --env HOME=/root \
            --publish 18081:80 \
            --env PS_DOMAIN=localhost:18081 \
            --env MYSQL_HOST=pdeca-presta-db \
            --env MYSQL_DATABASE=prestashop \
            --env MYSQL_USER=prestashop \
            --env MYSQL_PASSWORD=prestashop \
            --volume "$PWD/.artifacts/prestashop-module/puentedeca:/var/www/html/modules/puentedeca" \
            --volume "$PWD/.artifacts/presta-client.cnf:/root/.my.cnf:ro" \
            --volume "$PWD:/repo:ro" \
            '${{ matrix.image }}'

          booted=0
          for attempt in $(seq 1 90); do
            if docker exec pdeca-presta php -r '
              $f="/var/www/html/config/config.inc.php";
              if (!is_file($f)) { exit(2); }
              require $f;
              exit(defined("_PS_VERSION_") ? 0 : 3);
            ' >/dev/null 2>&1; then
              booted=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' pdeca-presta | grep -qx true; then
              docker logs pdeca-presta
              exit 1
            fi
            sleep 2
          done
          test "$booted" = "1"

      - name: Install exact packaged module through PrestaShop console
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            --workdir /var/www/html \
            pdeca-presta \
            php bin/console prestashop:module install puentedeca \
              --no-interaction
          docker exec pdeca-presta php -r '
            require "/var/www/html/config/config.inc.php";
            if (!Module::isInstalled("puentedeca")) {
              fwrite(STDERR, "Kairoseth Cargo module is not installed\n");
              exit(2);
            }
            $module = Module::getInstanceByName("puentedeca");
            if (!$module || empty($module->active)) {
              fwrite(STDERR, "Kairoseth Cargo module is not active\n");
              exit(3);
            }
          '

      - name: Execute synthetic mapping in real PrestaShop runtime
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            --env PDECA_PRESTASHOP_ROOT=/var/www/html \
            pdeca-presta \
            php /repo/scripts/ci/php/prestashop-full-stack-smoke.php \
            | tee .artifacts/connectors/prestashop-full-stack.json
          grep -F '"status":"ok"' .artifacts/connectors/prestashop-full-stack.json

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/ >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" = "1"

          printf '%s\n' \
            'prestashop=${{ matrix.prestashop }}' \
            'database=${{ matrix.database }}' \
            'httpRuntime=ok' \
            > .artifacts/connectors/prestashop-stack.txt
          sha256sum \
            .artifacts/connectors/prestashop-full-stack.json \
            .artifacts/connectors/prestashop-stack.txt \
            > .artifacts/connectors/prestashop-stack.sha256

      - name: Upload internal PrestaShop full-stack evidence
        uses: actions/upload-artifact@v4
        with:
          name: deca-internal-prestashop-${{ matrix.prestashop }}-${{ github.sha }}
          path: |
            .artifacts/connectors/prestashop-full-stack.json
            .artifacts/connectors/prestashop-stack.txt
            .artifacts/connectors/prestashop-stack.sha256
            .artifacts/connectors/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove isolated PrestaShop runtime
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm --force pdeca-presta >/dev/null 2>&1 || true
          docker rm --force pdeca-presta-db >/dev/null 2>&1 || true
          docker network rm pdeca-presta >/dev/null 2>&1 || true
