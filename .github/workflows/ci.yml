name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Build Unicode PDF visual smoke
        run: node scripts/ci/unicode-pdf-visual-smoke.mjs /tmp/puente-deca-unicode-smoke.pdf
      - name: Upload Unicode PDF visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: unicode-pdf-visual-smoke
          path: /tmp/puente-deca-unicode-smoke.pdf
          if-no-files-found: error
          retention-days: 1
